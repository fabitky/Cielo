<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#101a35"/>
      <stop offset="55%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <radialGradient id="horizon" cx="50%" cy="100%" r="65%">
      <stop offset="0%" stop-color="rgba(125,211,252,0.16)"/>
      <stop offset="100%" stop-color="rgba(125,211,252,0)"/>
    </radialGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#horizon)"/>

  <!-- Estrellas de fondo -->
  <g fill="#e8ecf4" opacity="0.5">
    <circle cx="88" cy="132" r="1.4"/>
    <circle cx="420" cy="96" r="1.2"/>
    <circle cx="450" cy="360" r="1.5"/>
    <circle cx="72" cy="330" r="1"/>
    <circle cx="360" cy="80" r="1"/>
    <circle cx="200" cy="60" r="1.2"/>
    <circle cx="140" cy="440" r="1"/>
    <circle cx="380" cy="430" r="1.3"/>
  </g>

  <!-- Halos de las estrellas principales -->
  <g filter="url(#soft)">
    <circle cx="256" cy="400" r="22" fill="#7dd3fc" opacity="0.5"/>
    <circle cx="256" cy="130" r="20" fill="#ff9c6a" opacity="0.4"/>
    <circle cx="150" cy="235" r="16" fill="#7dd3fc" opacity="0.4"/>
    <circle cx="365" cy="255" r="14" fill="#7dd3fc" opacity="0.4"/>
  </g>

  <!-- Núcleos de las estrellas de la Cruz del Sur -->
  <g filter="url(#glow)">
    <circle cx="256" cy="400" r="9" fill="#f0f6ff"/>
    <circle cx="256" cy="130" r="8.5" fill="#ffb47a"/>
    <circle cx="150" cy="235" r="7" fill="#dbe8ff"/>
    <circle cx="365" cy="255" r="6.5" fill="#dbe8ff"/>
  </g>

  <!-- Epsilon Crucis -->
  <circle cx="290" cy="305" r="3" fill="#e8ecf4" opacity="0.75"/>
</svg>