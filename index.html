<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05070d" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Guía astronómica offline para observadores aficionados." />

  <title>Cielo Sur</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cielo Sur" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="./assets/icon-512.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />

  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./chart.css" />
</head>
<body>
  <header id="topbar">
    <div class="topbar-inner">
      <h1 id="view-title">Hoy</h1>
      <button id="night-toggle" class="icon-btn" aria-label="Modo noche" title="Modo noche">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav id="tabbar" role="tablist">
    <button data-route="tonight" class="tab active" aria-label="Hoy">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>
      <span>Hoy</span>
    </button>
    <button data-route="sky" class="tab" aria-label="Cielo">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>
      <span>Cielo</span>
    </button>
    <button data-route="moon" class="tab" aria-label="Luna">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      <span>Luna</span>
    </button>
    <button data-route="events" class="tab" aria-label="Eventos">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Eventos</span>
    </button>
    <button data-route="wiki" class="tab" aria-label="Wiki">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 0-2 2V5Z"/><path d="M8 7h8M8 11h6"/></svg>
      <span>Wiki</span>
    </button>
    <button data-route="photo" class="tab" aria-label="Foto">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span>Foto</span>
    </button>
    <button data-route="settings" class="tab" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <script type="module" src="./app.js"></script>
</body>
</html>
